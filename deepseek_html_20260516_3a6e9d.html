<!DOCTYPE html>
<html>
<head>
    <title>Download Button Example</title>
    <meta charset="UTF-8">
</head>
<body>

    <h2>Download File Example</h2>

    <button id="downloadBtn" style="padding: 10px 20px; font-size: 16px;">Download File</button>

    <script>
        document.getElementById('downloadBtn').addEventListener('click', function() {
            // Example: Create a dummy text file and download it
            const content = "Yeh aapki downloaded file ka content hai!";
            const blob = new Blob([content], { type: 'text/plain' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = 'myfile.txt'; // Downloaded file ka naam
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });
    </script>

</body>
</html>
